# Vigia o canal de atualizacao do Gaspar sem publicar nada.
# Confere de tempos em tempos que o canal oficial e o espelho no gateway
# respondem, entregam os mesmos bytes assinados e apontam para a release mais
# nova publicada. Se algo sair disso, a execucao falha e o GitHub avisa.
name: Canal - vigilancia

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conferir:
    name: Conferir canal publicado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m pip install --quiet cryptography

      - name: Conferir o canal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/gaspar_channel.py monitor
