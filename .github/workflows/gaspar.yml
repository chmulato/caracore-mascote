name: Gaspar

# Esteira do Gaspar (desktop): testa, empacota Windows e Linux,
# publica os arquivos com impressão digital e prepara um rascunho de release.
#
# Etiquetas de release: gaspar-v1.7.0 (precisa bater com gaspar/__init__.py).

on:
  push:
    branches: [master]
    tags: ['gaspar-v*']
    paths:
      - 'gaspar/**'
      - 'tests/**'
      - 'packaging/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'run.py'
      - 'run_blackbox.py'
      - 'limpar_dist.py'
      - '.github/workflows/gaspar.yml'
  pull_request:
    paths:
      - 'gaspar/**'
      - 'tests/**'
      - 'packaging/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'run.py'
      - 'run_blackbox.py'
      - 'limpar_dist.py'
      - '.github/workflows/gaspar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaspar-${{ github.ref_type }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guardar cache do pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Preparar Python (Linux)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-venv python3-tk \
            xvfb openbox libx11-6 libxext6 libxtst6 libxss1
          python3 -m venv .venv --system-site-packages
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import tkinter, PyInstaller; print('Python pronto')"

      - name: Testes automáticos
        shell: bash
        run: |
          . .venv/bin/activate
          xvfb-run -a -s "-screen 0 1280x800x24" \
            python -m coverage run --source=gaspar -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report --fail-under=70

      - name: Teste de fumaça com tela virtual (Linux)
        shell: bash
        run: |
          . .venv/bin/activate
          xvfb-run -a -s "-screen 0 1280x800x24" \
            bash -c 'openbox >/dev/null 2>&1 & sleep 1; python tests/smoke_test.py'

  linux:
    name: Pacote Linux
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/gaspar-v')
    needs: test
    runs-on: ${{ fromJSON(vars.GASPAR_RELEASE_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 35
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Conferir etiqueta x versão
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/gaspar-v* ]]; then
            tag="${GITHUB_REF_NAME#gaspar-v}"
            code="$(python3 -c 'import gaspar; print(gaspar.__version__)')"
            echo "etiqueta=$tag código=$code"
            if [ "$tag" != "$code" ]; then
              echo "::error::A etiqueta $GITHUB_REF_NAME não confere com gaspar/__init__.py ($code)."
              exit 1
            fi
          fi

      - name: Preparar Python e dependências
        shell: bash
        env:
          GASPAR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [ "$GASPAR_RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              python3 python3-venv python3-tk dpkg-dev xvfb openbox \
              libx11-6 libxext6 libxtst6 libxss1
          fi
          python3 -m venv .venv --system-site-packages
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import tkinter, PyInstaller; print('Python pronto')"

      - name: Teste de fumaça com tela virtual (Linux)
        shell: bash
        run: |
          . .venv/bin/activate
          xvfb-run -a -s "-screen 0 1280x800x24" \
            bash -c 'openbox >/dev/null 2>&1 & sleep 1; python tests/smoke_test.py'

      - name: Baixar appimagetool
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --version || true

      - name: Empacotar .deb e AppImage
        shell: bash
        run: |
          . .venv/bin/activate
          APPIMAGETOOL=/tmp/appimagetool bash packaging/linux/build_linux.sh

      - name: Conferir os módulos da mensageria no pacote (D6)
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python packaging/verifica_pacote.py --arquivo dist/linux/gaspar

      - name: Gerar impressões digitais
        shell: bash
        run: |
          set -euo pipefail
          cd dist/linux
          sha256sum *.deb *.AppImage | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Guardar pacotes Linux
        uses: actions/upload-artifact@v4
        with:
          name: gaspar-linux
          path: dist/linux
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Pacote Windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/gaspar-v')
    needs: test
    runs-on: ${{ fromJSON(vars.GASPAR_WINDOWS_RUNNER || '["self-hosted","Windows","X64"]') }}
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        shell: bash
        run: |
          python -m venv .venv
          . .venv/Scripts/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import tkinter, PyInstaller; print('Python pronto')"

      - name: Testes automáticos (Windows)
        shell: bash
        env:
          GASPAR_HOME: ${{ runner.temp }}/gaspar-tests-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          . .venv/Scripts/activate
          python -m coverage run --source=gaspar -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report --fail-under=70

      - name: Teste de fumaça (Windows)
        shell: bash
        timeout-minutes: 10
        run: |
          . .venv/Scripts/activate
          python tests/smoke_test.py

      - name: Conferir etiqueta x versão
        shell: bash
        run: |
          set -euo pipefail
          code="$(python -c 'import gaspar; print(gaspar.__version__)')"
          echo "APP_VERSION=$code" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/gaspar-v* ]]; then
            tag="${GITHUB_REF_NAME#gaspar-v}"
            echo "etiqueta=$tag código=$code"
            if [ "$tag" != "$code" ]; then
              echo "::error::A etiqueta $GITHUB_REF_NAME não confere com gaspar/__init__.py ($code)."
              exit 1
            fi
          fi

      - name: Garantir Inno Setup
        shell: pwsh
        env:
          GASPAR_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc) -and $env:GASPAR_RUNNER_ENVIRONMENT -eq 'github-hosted') {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup não encontrado em $iscc"
          }

      - name: Empacotar executáveis e instalador
        shell: bash
        run: |
          . .venv/Scripts/activate
          python packaging/windows/build_windows.py

      - name: Conferir os módulos da mensageria no pacote (D6)
        shell: bash
        run: |
          set -euo pipefail
          . .venv/Scripts/activate
          python packaging/verifica_pacote.py --arquivo dist/windows/gaspar

      - name: Gerar impressões digitais
        shell: pwsh
        run: |
          $file = Get-Item -ErrorAction Stop "dist/installer/GasparSetup-$env:APP_VERSION.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLower()
          "$hash *$($file.Name)" | Set-Content -Encoding ascii dist/installer/SHA256SUMS.txt
          Get-Content dist/installer/SHA256SUMS.txt

      - name: Guardar pacotes Windows
        uses: actions/upload-artifact@v4
        with:
          name: gaspar-windows
          path: |
            dist/installer/GasparSetup-${{ env.APP_VERSION }}.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Rascunho de release
    if: startsWith(github.ref, 'refs/tags/gaspar-v')
    needs: [linux, windows]
    runs-on: ${{ fromJSON(vars.GASPAR_RELEASE_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Baixar pacotes Linux
        uses: actions/download-artifact@v4
        with:
          name: gaspar-linux
          path: dist/linux

      - name: Baixar pacotes Windows
        uses: actions/download-artifact@v4
        with:
          name: gaspar-windows
          path: dist/installer

      - name: Juntar impressões digitais
        shell: bash
        run: |
          set -euo pipefail
          ( cd dist/linux && sha256sum *.deb *.AppImage ) > dist/SHA256SUMS.txt
          ( cd dist/installer && sha256sum *.exe ) >> dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Preparar rascunho (você publica)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(dist/installer/*.exe dist/linux/*.deb dist/linux/*.AppImage dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              gh release upload "$TAG" "${ASSETS[@]}" --clobber
            else
              echo "::error::A release $TAG já está publicada. Nada foi alterado."
              exit 1
            fi
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --draft \
              --generate-notes \
              --title "Gaspar ${TAG#gaspar-v}"
          fi
