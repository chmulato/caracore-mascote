# Reduz paralelismo para evitar AccessDenied em .dex no Windows (antivirus/lock)
org.gradle.workers.max=1
org.gradle.parallel=false

# Dependencias AndroidX (androidx.core e zxing-android-embedded). Precisa estar
# no projeto, nao apenas no Gradle global da maquina de quem compila.
android.useAndroidX=true
