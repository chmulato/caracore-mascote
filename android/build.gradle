plugins {
    id 'com.android.application' version '7.4.2'
}

// Build na pasta build/ do projeto. Basta adicionar a pasta do projeto nas exclusões do Defender.

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasSigning = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def sf = (keystoreProperties['storeFile'] ?: '').toString().trim()
    hasSigning = sf != '' && file(sf).exists()
}
def trimProp = { key -> (keystoreProperties[key] ?: '').toString().trim() }

android {
    namespace 'br.com.caracore.pdv.sms'
    compileSdk 33

    defaultConfig {
        applicationId 'br.com.caracore.pdv.sms'
        minSdk 24
        targetSdk 27
        versionCode 3
        versionName '1.2'
        multiDexEnabled true
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(trimProp('storeFile'))
                storePassword trimProp('storePassword')
                keyAlias trimProp('keyAlias')
                keyPassword trimProp('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError true
        lintConfig file('lint.xml')
    }

    applicationVariants.all { variant ->
        if (variant.name == 'debug') {
            variant.outputs.all { output ->
                output.outputFileName = 'pdv-sms-enviar-1.0.apk'
            }
        }
        if (variant.name == 'release') {
            variant.outputs.all { output ->
                output.outputFileName = 'pdv-sms-enviar-1.0-release.apk'
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.6.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

// Renomeia app-release.aab -> pdv-sms-enviar-release.aab para o build.bat validar
afterEvaluate {
    tasks.named('bundleRelease').configure { task ->
        task.doLast {
            def dir = file("$buildDir/outputs/bundle/release")
            def defaultAab = file("$dir/app-release.aab")
            def targetAab = file("$dir/pdv-sms-enviar-release.aab")
            if (defaultAab.exists() && defaultAab != targetAab) {
                defaultAab.renameTo(targetAab)
                println "AAB renomeado: pdv-sms-enviar-release.aab"
            }
        }
    }
}
